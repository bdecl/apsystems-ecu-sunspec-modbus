# Dashboard for the apsystems_ecu_sunspec integration, single-phase inverters
# (DS3, QS1 and similar). Native cards only, no custom card needed.
#
# How to use: Settings > Dashboards > Add dashboard, open it, three dots >
# Edit dashboard > three dots > Raw configuration editor, paste this file.
#
# Entity ids assume the default device names: "APsystems ECU" (no ECU ID
# entered) and "<model> (<last 5 digits of the serial>)" for the inverters.
# Replace "ds3_aaaaa_" and "ds3_bbbbb_" with the start of your inverters'
# entity ids (e.g. "ds3_12345_"), and "apsystems_ecu_" if you entered an
# ECU ID (e.g. "ecu_c_1234_").
#
# The per-inverter part lists two inverters: copy the blocks marked
# "one per inverter" for every inverter the integration found.

title: Solar
views:
  - title: Solar
    path: solar
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Array
          - type: gauge
            entity: sensor.apsystems_ecu_power
            name: Production
            min: 0
            max: 8000           # your array's rated power, in W
            needle: true
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.apsystems_ecu_energy_today
            name: Energy today
          - type: tile
            entity: sensor.apsystems_ecu_inverters_producing
            name: Inverters producing
          - type: tile
            entity: sensor.apsystems_ecu_dc_power_total
            name: DC power
          - type: tile
            entity: sensor.apsystems_ecu_events
            name: Events

      - type: grid
        cards:
          - type: heading
            heading: Curtailment
          - type: tile
            entity: number.apsystems_ecu_power_limit
            name: Power limit
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 12
          - type: tile
            entity: switch.apsystems_ecu_power_limit_enabled
            name: Limit enabled
          - type: tile
            entity: switch.apsystems_ecu_production
            name: Production
            # Off stops every inverter of the ECU.
          - type: markdown
            content: >-
              The limit and the production switch act on the **whole array**.
              Dispatch to the inverters takes about 20 s.
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Today
          - type: history-graph
            title: Production and limit
            hours_to_show: 24
            entities:
              - entity: sensor.apsystems_ecu_power
                name: Production
              - entity: number.apsystems_ecu_power_limit
                name: Limit
            grid_options:
              columns: 12
          - type: statistics-graph
            title: Daily energy
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.apsystems_ecu_energy_today
                name: Energy
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Inverters
          # one per inverter --------------------------------------------
          - type: tile
            entity: sensor.ds3_aaaaa_power
            name: Inverter 1
          - type: tile
            entity: sensor.ds3_bbbbb_power
            name: Inverter 2
          # ---------------------------------------------------------------
          - type: history-graph
            title: Power per inverter
            hours_to_show: 24
            entities:
              - entity: sensor.ds3_aaaaa_power   # one per inverter
              - entity: sensor.ds3_bbbbb_power
            grid_options:
              columns: 12

      # one per inverter ------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Inverter 1
          - type: entities
            title: AC
            entities:
              - entity: sensor.ds3_aaaaa_operating_state
                name: State
              - entity: sensor.ds3_aaaaa_power
                name: Power
              - entity: sensor.ds3_aaaaa_current
                name: Current
              - entity: sensor.ds3_aaaaa_voltage
                name: Voltage
              - entity: sensor.ds3_aaaaa_frequency
                name: Frequency
              - entity: sensor.ds3_aaaaa_temperature
                name: Temperature
              - entity: sensor.ds3_aaaaa_events
                name: Events
            grid_options:
              columns: 12
          - type: glance
            title: DC (panels)
            columns: 2
            entities:
              - entity: sensor.ds3_aaaaa_dc1_power
                name: DC1
              - entity: sensor.ds3_aaaaa_dc2_power
                name: DC2
              - entity: sensor.ds3_aaaaa_dc1_voltage
                name: DC1
              - entity: sensor.ds3_aaaaa_dc2_voltage
                name: DC2
            grid_options:
              columns: 12
      # -------------------------------------------------------------------------
